name: sorokchat
services:
  database-production:
    image: postgres:18-alpine
    container_name: sorokchat.database-production
    restart: always
    env_file: ./database/database.env
    volumes:
      - ./database/postgres_production_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sorokchat" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sorokchat
  database-development:
    image: postgres:18-alpine
    container_name: sorokchat.database-development
    restart: always
    env_file: ./database/database.env
    ports:
      - "5433:5432"
    volumes:
      - ./database/postgres_development_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sorokchat" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sorokchat
  pgadmin:
    image: dpage/pgadmin4:7
    container_name: sorokchat.pgadmin
    restart: always
    env_file: ./database/pgadmin.env
    ports:
      - "8081:80"
    depends_on:
      - database-production
      - database-development
    networks:
      - sorokchat
  rabbitmq:
    image: rabbitmq:3-management
    container_name: sorokchat.rabbitmq
    ports:
      - "15672:15672"
    env_file: ./rabbitmq/rabbitmq.env
    volumes:
      - ./rabbitmq/rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq_logs:/var/log/rabbitmq
    networks:
      - sorokchat
networks:
  sorokchat:
    name: sorokchat
